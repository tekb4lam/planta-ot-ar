<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Planta OT · Realidad aumentada</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #app { position: fixed; inset: 0; }
    #overlay {

    #overlay p { font-size: 14px; line-height: 1.45; color: #94a3b8; margin: 0 0 14px; }

      display: block; width: 100%; margin: 8px 0 0; padding: 14px 16px; font-size: 16px; font-weight: 650;
      border-radius: 12px; border: 1px solid #22d3ee; background: #0e7490; color: #fff; cursor: pointer;
    }
    .btn[hidden] { display: none; }
    .btn:hover { background: #0891b2; }
    .btn.secondary { background: #1e293b; border-color: #334155; }
    #status { font-size: 13px; color: #67e8f9; margin-top: 12px; min-height: 18px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #22d3ee; margin-bottom: 8px; }
    body.xr #overlay { display: none; }
    @media (max-width: 640px) { #overlay { left: 12px; right: 12px; top: 12px; max-width: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">

    <button id="btn-ar" class="btn" hidden>Entrar en realidad aumentada</button>
    <button id="btn-vr" class="btn secondary" hidden>Entrar en VR (sin passthrough)</button>
    <div id="status">Comprobando compatibilidad WebXR…</div>
